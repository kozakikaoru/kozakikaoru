<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" width="760" height="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="2017 給食管理システム コーディング・コードレビュー 技術: Ruby Rails ERB MySQL">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="132" fill="#0d1117"/>

  <line x1="20" y1="0" x2="20" y2="132" stroke="url(#rail)" stroke-width="2.6" opacity="0.85"/>
  <circle cx="20" cy="34" r="9" fill="#00e5ff" opacity="0.5" filter="url(#softglow)"/>
  <circle cx="20" cy="34" r="6.5" fill="#0d1117" stroke="#00e5ff" stroke-width="2.4" filter="url(#glow)"/>
  <circle cx="20" cy="34" r="2.2" fill="#00e5ff"/>

  <rect x="44" y="10" width="704" height="112" rx="10" fill="#131a24" stroke="#233140" stroke-width="1"/>
  <rect x="44" y="10" width="3.5" height="112" rx="1.75" fill="#00e5ff" filter="url(#glow)"/>

  <text x="64" y="40" fill="#ffffff" font-size="17" font-weight="700">給食管理システム</text>
  <rect x="668" y="24" width="60" height="24" rx="12" fill="rgba(0,229,255,0.10)" stroke="#00e5ff" stroke-opacity="0.42" stroke-width="1"/>
  <text x="698" y="40" fill="#5fe9ff" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">2017</text>

  <text x="64" y="66" fill="#9fb0c0" font-size="13">コーディング・コードレビュー</text>

  <!-- Ruby -->
  <rect x="64" y="84" width="54" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="91" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">Ruby</text>
  <!-- Rails -->
  <rect x="124" y="84" width="54" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="151" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">Rails</text>
  <!-- ERB -->
  <rect x="184" y="84" width="48" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="208" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">ERB</text>
  <!-- MySQL -->
  <rect x="238" y="84" width="62" height="22" rx="4" fill="rgba(109,181,255,0.14)"/>
  <text x="269" y="99" fill="#8cc5ff" font-size="12" text-anchor="middle">MySQL</text>
</svg>
