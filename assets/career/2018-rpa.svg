<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" width="760" height="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="2018 Windows向け RPA オンライン決済実装(Stripe) 技術: Ruby Rails Slim RSpec Stripe">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="132" fill="#0d1117"/>

  <line x1="20" y1="0" x2="20" y2="132" stroke="url(#rail)" stroke-width="2.6" opacity="0.85"/>
  <circle cx="20" cy="34" r="9" fill="#7c4dff" opacity="0.5" filter="url(#softglow)"/>
  <circle cx="20" cy="34" r="6.5" fill="#0d1117" stroke="#7c4dff" stroke-width="2.4" filter="url(#glow)"/>
  <circle cx="20" cy="34" r="2.2" fill="#7c4dff"/>

  <rect x="44" y="10" width="704" height="112" rx="10" fill="#131a24" stroke="#233140" stroke-width="1"/>
  <rect x="44" y="10" width="3.5" height="112" rx="1.75" fill="#7c4dff" filter="url(#glow)"/>

  <text x="64" y="40" fill="#ffffff" font-size="17" font-weight="700">Windows 向け RPA</text>
  <rect x="668" y="24" width="60" height="24" rx="12" fill="rgba(124,77,255,0.12)" stroke="#7c4dff" stroke-opacity="0.40" stroke-width="1"/>
  <text x="698" y="40" fill="#b39dff" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">2018</text>

  <text x="64" y="66" fill="#9fb0c0" font-size="13">オンライン決済実装(Stripe)</text>

  <!-- Ruby -->
  <rect x="64" y="84" width="54" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="91" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">Ruby</text>
  <!-- Rails -->
  <rect x="124" y="84" width="54" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="151" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">Rails</text>
  <!-- Slim -->
  <rect x="184" y="84" width="50" height="22" rx="4" fill="rgba(159,176,192,0.14)"/>
  <text x="209" y="99" fill="#c3cedb" font-size="12" text-anchor="middle">Slim</text>
  <!-- RSpec -->
  <rect x="240" y="84" width="60" height="22" rx="4" fill="rgba(255,203,61,0.14)"/>
  <text x="270" y="99" fill="#ffd45c" font-size="12" text-anchor="middle">RSpec</text>
  <!-- Stripe -->
  <rect x="306" y="84" width="58" height="22" rx="4" fill="rgba(167,139,250,0.16)"/>
  <text x="335" y="99" fill="#bda6ff" font-size="12" text-anchor="middle">Stripe</text>
</svg>
