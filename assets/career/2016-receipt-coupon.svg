<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" width="760" height="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="2016 START レシートクーポン管理アプリ 管理画面・バッチ処理・Android/iOS バグ修正 技術: Ruby Rails ERB Java Swift">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="132" fill="#0d1117"/>

  <!-- rail stops at the start node (this is the origin of the journey) -->
  <line x1="20" y1="0" x2="20" y2="34" stroke="url(#rail)" stroke-width="2.6" opacity="0.85"/>
  <circle cx="20" cy="34" r="11" fill="#7c4dff" opacity="0.55" filter="url(#softglow)"/>
  <circle cx="20" cy="34" r="7.5" fill="#0d1117" stroke="#7c4dff" stroke-width="2.6" filter="url(#glow)"/>
  <circle cx="20" cy="34" r="2.4" fill="#7c4dff"/>

  <rect x="44" y="10" width="704" height="112" rx="10" fill="#16222e" stroke="#233140" stroke-width="1"/>
  <rect x="44" y="10" width="3.5" height="112" rx="1.75" fill="#7c4dff" filter="url(#glow)"/>

  <text x="64" y="40" fill="#ffffff" font-size="17" font-weight="700">レシートクーポン管理アプリ</text>
  <rect x="624" y="24" width="104" height="24" rx="12" fill="rgba(124,77,255,0.14)" stroke="#7c4dff" stroke-opacity="0.45" stroke-width="1"/>
  <text x="676" y="40" fill="#b39dff" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">2016 START</text>

  <text x="64" y="66" fill="#9fb0c0" font-size="13">管理画面・バッチ処理・Android/iOS バグ修正</text>

  <!-- Ruby -->
  <rect x="64" y="84" width="54" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="91" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">Ruby</text>
  <!-- Rails -->
  <rect x="124" y="84" width="54" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="151" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">Rails</text>
  <!-- ERB -->
  <rect x="184" y="84" width="48" height="22" rx="4" fill="rgba(255,82,119,0.13)"/>
  <text x="208" y="99" fill="#ff7a96" font-size="12" text-anchor="middle">ERB</text>
  <!-- Java -->
  <rect x="238" y="84" width="50" height="22" rx="4" fill="rgba(240,168,106,0.16)"/>
  <text x="263" y="99" fill="#f3b885" font-size="12" text-anchor="middle">Java</text>
  <!-- Swift -->
  <rect x="294" y="84" width="54" height="22" rx="4" fill="rgba(240,168,106,0.16)"/>
  <text x="321" y="99" fill="#f3b885" font-size="12" text-anchor="middle">Swift</text>
</svg>
